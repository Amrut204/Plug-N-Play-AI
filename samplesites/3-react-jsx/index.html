<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sterling Private Bank — React JSX Sample Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #09090b;
        --surface: #121215;
        --border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-muted: #a1a1aa;
        --accent-purple: #c084fc;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding: 32px 24px; }
      .app-container { max-width: 1100px; margin: 0 auto; }
      .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
      .bank-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
      .btn-action { background: #18181b; border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-container">
        <header class="nav-bar">
          <div style="font-size: 20px; font-weight: 800;">🏛️ Sterling Private Bank (React JSX)</div>
          <button class="btn-action" style="background: #ffffff; color: #000;">Secure Portal</button>
        </header>
        <main>
          <div class="card-grid">
            <div class="bank-card">
              <div style="font-size: 12px; color: var(--accent-purple); font-weight: 700; text-transform: uppercase;">Primary Checking Account</div>
              <div style="font-size: 36px; font-weight: 800; margin: 12px 0 20px;">$24,850.75</div>
              <div style="display: flex; gap: 10px;">
                <button class="btn-action">Transfer</button>
                <button class="btn-action">Statements</button>
              </div>
            </div>
            <div class="bank-card">
              <div style="font-size: 12px; color: #22c55e; font-weight: 700; text-transform: uppercase;">High-Yield Treasury Savings (5.2% APY)</div>
              <div style="font-size: 36px; font-weight: 800; margin: 12px 0 20px;">$142,500.00</div>
              <div style="display: flex; gap: 10px;">
                <button class="btn-action">Deposit</button>
                <button class="btn-action">Interest Breakdown</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Live Action Event Receiver Banner -->
    <div id="pnp-action-toast" style="display:none; position:fixed; top:20px; right:20px; z-index:999999; background:#0f172a; color:#fff; border:1px solid #22c55e; border-radius:10px; padding:14px 18px; box-shadow:0 12px 35px rgba(0,0,0,0.6); font-family:system-ui, -apple-system, sans-serif; max-width:380px;">
      <div style="font-weight:700; color:#4ade80; font-size:12px; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
        <span>⚡ HOST APP RECEIVED ACTION:</span> <span id="pnp-toast-name"></span>
      </div>
      <div id="pnp-toast-payload" style="font-size:11.5px; font-family:monospace; background:rgba(0,0,0,0.5); padding:6px 8px; border-radius:6px; color:#e2e8f0; word-break:break-all;"></div>
    </div>

    <script>
      // 1. Client-Side Action Handler for Browser Relay Mode
      const _origFetch = window.fetch;
      window.fetch = async function(url, opts) {
        if (typeof url === 'string' && (url === '/api/orders/cancel' || url.endsWith('/api/orders/cancel'))) {
          const body = opts?.body ? JSON.parse(opts.body) : {};
          showClientActionToast('cancel_order', body);
          return new Response(JSON.stringify({
            status: 'success',
            order_id: body.order_id,
            refund_amount: 349.99,
            reference_id: `CAN-${body.order_id}-${Math.floor(Math.random()*9000+1000)}`,
            message: 'Order cancelled directly via host app session!'
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }
        if (typeof url === 'string' && (url === '/api/appointments/reschedule' || url.endsWith('/api/appointments/reschedule'))) {
          const body = opts?.body ? JSON.parse(opts.body) : {};
          showClientActionToast('reschedule_appointment', body);
          return new Response(JSON.stringify({
            status: 'success',
            booking_id: body.booking_id,
            new_date: body.preferred_date,
            reference_id: `RESCHED-${Math.floor(Math.random()*9000+1000)}`
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }
        return _origFetch.apply(this, arguments);
      };

      // 2. CustomEvent Listener for WebSocket / Event-Driven integrations
      window.addEventListener('pnp:action:execute', (e) => {
        showClientActionToast(e.detail?.display_name || e.detail?.name, e.detail?.parameters);
      });

      function showClientActionToast(name, payload) {
        const toast = document.getElementById('pnp-action-toast');
        const nEl = document.getElementById('pnp-toast-name');
        const pEl = document.getElementById('pnp-toast-payload');
        if (toast && nEl && pEl) {
          nEl.innerText = name;
          pEl.innerText = JSON.stringify(payload, null, 2);
          toast.style.display = 'block';
          setTimeout(() => { toast.style.display = 'none'; }, 6000);
        }
      }
    </script>

    <!-- Plug-N-Play AI Universal Widget -->
    <script 
      src="http://127.0.0.1:8000/static/pnp-widget.js"
      data-api-host="http://127.0.0.1:8000"
      data-agent-id="49e431f4-893a-414e-a42e-7582d3fbf0c6"
      data-title="OmniAction Enterprise AI"
      data-primary-color="#09090b"
      data-accent-color="#22c55e"
      data-bg-color="#09090b"
      data-header-bg="#121215"
      data-text-color="#f8fafc"
      data-user-bubble="#22c55e"
      data-position="bottom-right"
      data-widget-size="medium"
      data-btn-shape="circle"
      data-border-radius="24"
      data-theme="dark"
      data-welcome="Hello! I am OmniAction Enterprise AI. I can cancel orders or reschedule appointments. Try an action prompt below:"
      data-starter-questions="Please cancel my order 1001,Please reschedule appointment BKG-992 to tomorrow"
      data-show-branding="true">
    </script>
  </body>
</html>
